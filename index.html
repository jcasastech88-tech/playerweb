<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050505">
    <script disable-devtool-auto="true" src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <title>Reproductor Pro Cinewick</title>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #00e5c8;          /* color principal (el tema puede mandar otro con ?c=RRGGBB) */
            --accent-rgb: 0, 229, 200;
            --bg: #050505;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, .74);
            --error: #ff5d5d;

            /* Todo escala con el alto del propio reproductor */
            --pb: clamp(50px, 17vh, 92px);
            --gap: clamp(5px, 1.7vh, 15px);
            --fs-title: clamp(1.15rem, 6.4vh, 2.7rem);
            --fs-chip: clamp(.62rem, 2.5vh, .82rem);
            --fs-syn: clamp(.78rem, 2.7vh, 1rem);
        }

        html, body {
            width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
            font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #player {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: 0; display: none; z-index: 1; background: #000;
        }

        /* ───────── Escenario (portada + carga + error) ───────── */
        .stage {
            position: absolute; inset: 0; z-index: 10; overflow: hidden;
            transition: opacity .7s ease, visibility .7s;
        }
        .stage.out { opacity: 0; visibility: hidden; }

        .bg { position: absolute; inset: 0; background: #07090b; }
        .bg-img {
            position: absolute; inset: -5%; background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.3s ease; will-change: transform, opacity;
        }
        .bg-img.lo { filter: blur(16px) brightness(.8); }
        .bg-img.on { opacity: 1; }
        .bg-img.hi.on { animation: kenburns 30s ease-in-out infinite alternate; }
        @keyframes kenburns {
            from { transform: scale(1.03) translate3d(0, 0, 0); }
            to   { transform: scale(1.16) translate3d(-1.6%, -1.1%, 0); }
        }
        .shade {
            position: absolute; inset: 0;
            background:
                radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,.12) 0%, rgba(0,0,0,.62) 68%, rgba(0,0,0,.92) 100%),
                linear-gradient(180deg, rgba(0,0,0,.62) 0%, transparent 30%, transparent 52%, rgba(0,0,0,.9) 100%);
        }

        /* Barra superior */
        .top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 4;
            display: flex; justify-content: space-between; align-items: center;
            padding: max(clamp(8px, 2.2vh, 16px), env(safe-area-inset-top)) clamp(10px, 3vw, 22px) 0;
        }
        .brand {
            display: flex; align-items: center; gap: .5em;
            font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
            letter-spacing: .2em; font-size: clamp(.82rem, 3.1vh, 1.2rem); opacity: .9;
        }
        .brand i { width: .5em; height: .5em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .badge {
            font-size: clamp(.58rem, 2.3vh, .76rem); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            padding: .3em .85em; border-radius: 999px;
            background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }

        /* Centro: titulo, datos, play */
        .center {
            position: absolute; inset: 0; z-index: 3;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: var(--gap); text-align: center;
            padding: clamp(26px, 8vh, 56px) clamp(14px, 5vw, 56px) clamp(10px, 3vh, 28px);
            transition: opacity .45s ease, transform .45s ease;
        }
        .stage.busy .center, .stage.err .center { opacity: 0; transform: scale(.97); pointer-events: none; }

        .logo {
            display: none; max-height: clamp(34px, 21vh, 130px); max-width: min(78%, 440px);
            object-fit: contain; filter: drop-shadow(0 4px 18px rgba(0,0,0,.75));
            opacity: 0; transition: opacity .6s ease;
        }
        .logo.on { opacity: 1; }
        .title {
            font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400;
            font-size: var(--fs-title); line-height: 1.04; letter-spacing: .02em;
            text-shadow: 0 3px 18px rgba(0,0,0,.85); max-width: min(92%, 760px);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .skel {
            color: transparent !important; text-shadow: none; border-radius: 8px; min-width: 46%;
            background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.18), rgba(255,255,255,.06));
            background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
        }
        @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

        .ep {
            font-size: clamp(.72rem, 2.9vh, 1.05rem); color: var(--accent); font-weight: 700; letter-spacing: .04em;
            text-shadow: 0 2px 10px rgba(0,0,0,.8); max-width: 92%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ep[hidden], .logo[hidden], .syn[hidden] { display: none !important; }

        .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, 1.2vh, 8px); max-width: 94%; }
        .chip {
            font-size: var(--fs-chip); font-weight: 500; line-height: 1; white-space: nowrap;
            padding: .42em .8em; border-radius: 999px; color: var(--muted);
            background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .chip.star { color: #ffd166; font-weight: 700; }
        .chip.lang { color: #04100e; background: var(--accent); border-color: transparent; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

        .syn {
            display: none; max-width: min(90%, 580px); color: var(--muted); font-size: var(--fs-syn); line-height: 1.5;
            text-shadow: 0 2px 10px rgba(0,0,0,.9);
            -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        @media (min-height: 340px) { .syn { display: -webkit-box; } }

        /* Boton play */
        .play {
            position: relative; width: var(--pb); height: var(--pb); border: 0; border-radius: 50%; cursor: pointer;
            display: grid; place-items: center; color: #04100e; background: var(--accent);
            box-shadow: 0 10px 44px rgba(var(--accent-rgb), .5), inset 0 0 0 1px rgba(255,255,255,.25);
            transition: transform .25s ease, box-shadow .25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .play::before, .play::after {
            content: ""; position: absolute; inset: -9px; border-radius: 50%;
            border: 2px solid rgba(var(--accent-rgb), .55); animation: ring 2.6s ease-out infinite; pointer-events: none;
        }
        .play::after { animation-delay: 1.3s; }
        @keyframes ring { 0% { transform: scale(.88); opacity: .85; } 100% { transform: scale(1.55); opacity: 0; } }
        .play svg { width: 44%; height: 44%; fill: currentColor; margin-left: 7%; }
        .play:hover { transform: scale(1.08); box-shadow: 0 14px 56px rgba(var(--accent-rgb), .7), inset 0 0 0 1px rgba(255,255,255,.3); }
        .play:active { transform: scale(.95); }
        .play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
        .hint { font-size: clamp(.68rem, 2.6vh, .9rem); letter-spacing: .06em; color: var(--muted); text-shadow: 0 2px 8px rgba(0,0,0,.9); }
        @media (max-height: 239px) { .hint { display: none; } }

        /* Pantalla de carga */
        .loader {
            position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: clamp(8px, 2.4vh, 18px);
            opacity: 0; pointer-events: none; transition: opacity .45s ease;
        }
        .stage.busy .loader { opacity: 1; }
        .stage.err .loader { opacity: 0; }
        .ring {
            width: clamp(34px, 12vh, 62px); height: clamp(34px, 12vh, 62px); border-radius: 50%;
            border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent);
            animation: spin .9s linear infinite; box-shadow: 0 0 28px rgba(var(--accent-rgb), .25);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ltitle { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: .06em; font-size: clamp(.95rem, 4.6vh, 1.7rem); text-shadow: 0 2px 14px rgba(0,0,0,.9); max-width: 90%; text-align: center; }
        .lstep { font-size: clamp(.68rem, 2.6vh, .92rem); color: var(--muted); min-height: 1.2em; }
        .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.1); }
        .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
        .stage.busy .bar i { animation: fill 7s cubic-bezier(.1,.6,.2,1) forwards; }
        .stage.done .bar i { animation: none; width: 100%; transition: width .3s ease; }
        @keyframes fill { from { width: 0; } to { width: 86%; } }

        /* Error / lentitud */
        .errbox {
            position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: clamp(6px, 2vh, 14px);
            padding: clamp(14px, 4vh, 36px); text-align: center; background: rgba(5,5,5,.62);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .stage.err .errbox { display: flex; }
        .errbox svg { width: clamp(26px, 9vh, 46px); height: clamp(26px, 9vh, 46px); fill: var(--error); }
        .errbox h2 { font-size: clamp(.95rem, 4vh, 1.4rem); font-weight: 700; }
        .errbox p { font-size: clamp(.7rem, 2.7vh, .95rem); color: var(--muted); max-width: 440px; line-height: 1.45; }
        .errbox p:empty { display: none; }
        .retry {
            margin-top: 2px; padding: .65em 1.5em; border: 0; border-radius: 999px; cursor: pointer;
            font: 700 clamp(.72rem, 2.8vh, .95rem) 'DM Sans', sans-serif; color: #04100e; background: var(--accent);
            box-shadow: 0 8px 28px rgba(var(--accent-rgb), .4);
        }
        .retry[hidden] { display: none; }
        .retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        /* Aviso "Reproduciendo" sobre el video */
        .toast {
            position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 20; max-width: 80%;
            display: flex; align-items: center; gap: .6em; padding: .5em 1em .5em .8em; border-radius: 999px;
            font-size: clamp(.66rem, 2.6vh, .86rem); font-weight: 500; pointer-events: none;
            background: rgba(8,8,8,.78); border: 1px solid rgba(255,255,255,.14);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            opacity: 0; transform: translateY(-8px); transition: opacity .4s ease, transform .4s ease;
        }
        .toast.on { opacity: 1; transform: none; }
        .toast i { width: .55em; height: .55em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex-shrink: 0; }
        .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (prefers-reduced-motion: reduce) {
            .bg-img.hi.on, .play::before, .play::after, .ring, .skel { animation: none !important; }
            .stage, .center, .bg-img { transition: none; }
        }
    </style>
</head>
<body>

    <div id="stage" class="stage">
        <div class="bg">
            <div id="bgLo" class="bg-img lo"></div>
            <div id="bgHi" class="bg-img hi"></div>
            <div class="shade"></div>
        </div>

        <div class="top">
            <div class="brand"><i></i>CINEWICK</div>
            <div id="badge" class="badge"></div>
        </div>

        <main id="center" class="center">
            <img id="logo" class="logo" alt="" hidden>
            <h1 id="title" class="title skel">&nbsp;</h1>
            <div id="ep" class="ep" hidden></div>
            <div id="meta" class="meta"></div>
            <p id="syn" class="syn" hidden></p>
            <button id="play" class="play" type="button" aria-label="">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div id="hint" class="hint"></div>
        </main>

        <div class="loader" aria-live="polite">
            <div class="ring"></div>
            <div id="ltitle" class="ltitle"></div>
            <div id="lstep" class="lstep"></div>
        </div>
        <div class="bar"><i></i></div>

        <div id="errbox" class="errbox" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            <h2 id="errTitle"></h2>
            <p id="errText"></p>
            <button id="retry" class="retry" type="button" hidden></button>
        </div>
    </div>

    <iframe id="player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="origin"></iframe>
    <div id="toast" class="toast" aria-hidden="true"><i></i><span id="toastText"></span></div>

    <script>
    (function () {
        'use strict';

        /* ═══ Configuracion de esta version (ES / EN) ═══ */
        var CFG = {"lang": "es", "tmdbLang": "es-MX", "imgLangs": "es,es-419,en,null", "certOrder": ["MX", "ES", "US"], "badge": "Español", "t": {"play": "Reproducir", "tap": "Toca para reproducir", "steps": ["Conectando…", "Preparando el reproductor…", "Casi listo…"], "now": "Reproduciendo", "retry": "Reintentar", "badLink": "Enlace no disponible", "unknown": "Estructura de enlace no reconocida.", "corrupt": "El enlace de video está corrupto o incompleto.", "blocked": "Servidor no permitido.", "slow": "Este servidor está tardando", "slowHint": "Reintenta o prueba otro servidor desde el menú del reproductor.", "available": "Video disponible", "s": "T", "e": "E"}};

        var TMDB_API_KEY = '51800c8d9e13631a7ded6f17f363e7a5';
        var MIN_MS = 900;                 /* tiempo minimo de pantalla de carga (se siente mas fluido) */
        var DEFAULT_TIMEOUT_S = 15;       /* si el servidor no carga en este tiempo, avisa y ofrece reintentar */
        /* true = solo estos servidores pueden abrirse desde este reproductor */
        var STRICT_HOSTS = false;
        var ALLOWED_HOSTS = ['vimeus.net', 'embed69.org', 'unlimplay.com'];

        function $(id) { return document.getElementById(id); }
        var qs = new URLSearchParams(location.search);
        var T = CFG.t;
        var S = { url: '', tipo: 'movie', id: '', season: '', episode: '', title: '', started: false, loaded: false, t0: 0 };
        var timers = { fail: 0, step: [] };

        /* ═══ Mensajes al sitio (para que el tema reaccione) ═══ */
        function emit(state, extra) {
            try {
                var msg = { source: 'cw-player', state: state, tipo: S.tipo, id: S.id, season: S.season, episode: S.episode, title: S.title };
                if (extra) for (var k in extra) msg[k] = extra[k];
                window.parent.postMessage(msg, '*');
            } catch (e) {}
        }

        /* ═══ Color de acento que manda el tema (?c=RRGGBB) ═══ */
        (function () {
            var c = qs.get('c');
            if (c && /^[0-9a-f]{6}$/i.test(c)) {
                var r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
                var st = document.documentElement.style;
                st.setProperty('--accent', '#' + c);
                st.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
            }
        })();

        /* ═══ Textos fijos ═══ */
        $('badge').textContent = CFG.badge;
        $('play').setAttribute('aria-label', T.play);
        $('hint').textContent = T.tap;

        /* ═══ Utilidades ═══ */
        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
        }
        function fmtRuntime(m) {
            m = parseInt(m, 10);
            if (!m || m < 1) return '';
            var h = Math.floor(m / 60), mm = m % 60;
            return h ? (mm ? h + ' h ' + mm + ' min' : h + ' h') : mm + ' min';
        }
        function pad(n) { return String(n); }
        function preload(url) {
            return new Promise(function (res) {
                var i = new Image();
                i.onload = function () { res(url); };
                i.onerror = function () { res(null); };
                i.src = url;
            });
        }
        function tmdb(path) {
            var ctl = ('AbortController' in window) ? new AbortController() : null;
            var to = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
            var url = 'https://api.themoviedb.org/3' + path + (path.indexOf('?') > -1 ? '&' : '?') + 'api_key=' + TMDB_API_KEY;
            return fetch(url, ctl ? { signal: ctl.signal } : undefined)
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; })
                .then(function (d) { clearTimeout(to); return d; });
        }

        /* ═══ Errores ═══ */
        function showError(title, text, canRetry) {
            clearTimeout(timers.fail);
            timers.step.forEach(clearTimeout); timers.step = [];
            var st = $('stage');
            st.classList.remove('busy', 'out', 'done');
            st.classList.add('err');
            $('errTitle').textContent = title;
            $('errText').textContent = text || '';
            var rb = $('retry');
            rb.hidden = !canRetry;
            rb.textContent = T.retry;
            $('play').style.display = 'none';
        }

        /* ═══ 1) Leer el enlace (#tipo-id-b64  o  #tv-id-temp-ep-b64) ═══ */
        function parseHash() {
            var parts = location.hash.substring(1).split('-');
            var b64;
            if (parts.length === 5) {
                S.tipo = parts[0]; S.id = parts[1]; S.season = parts[2]; S.episode = parts[3]; b64 = parts[4];
            } else if (parts.length === 3) {
                S.tipo = parts[0]; S.id = parts[1]; b64 = parts[2];
            } else {
                return T.unknown;
            }
            if (S.tipo !== 'movie' && S.tipo !== 'tv') S.tipo = parts.length === 5 ? 'tv' : 'movie';
            if (!/^\d+$/.test(S.id)) return T.unknown;
            var real;
            try { real = atob(b64); } catch (e) { return T.corrupt; }
            if (!/^https?:\/\//i.test(real)) return T.corrupt;
            if (STRICT_HOSTS) {
                var host = '';
                try { host = new URL(real).hostname.toLowerCase(); } catch (e2) { return T.corrupt; }
                var okHost = ALLOWED_HOSTS.some(function (h) { return host === h || host.slice(-(h.length + 1)) === '.' + h; });
                if (!okHost) return T.blocked;
            }
            S.url = real;
            return '';
        }

        /* Conexion anticipada al servidor de video: arranca mas rapido al tocar play */
        function preconnect(url) {
            try {
                var origin = new URL(url).origin;
                ['preconnect', 'dns-prefetch'].forEach(function (rel) {
                    var l = document.createElement('link');
                    l.rel = rel; l.href = origin;
                    if (rel === 'preconnect') l.crossOrigin = '';
                    document.head.appendChild(l);
                });
            } catch (e) {}
        }

        /* ═══ 2) Datos de TMDB (se rellenan sin bloquear el play) ═══ */
        function pickLogo(images) {
            var logos = (images && images.logos) || [];
            if (!logos.length) return null;
            var pref = [CFG.lang, 'en', null];
            for (var i = 0; i < pref.length; i++) {
                var cand = logos.filter(function (l) { return (l.iso_639_1 || null) === pref[i]; });
                if (cand.length) {
                    cand.sort(function (a, b) { return (b.vote_average || 0) - (a.vote_average || 0); });
                    return cand[0].file_path;
                }
            }
            return logos[0].file_path;
        }
        function pickCert(d) {
            var order = CFG.certOrder, i, j, res, r;
            if (d.release_dates && d.release_dates.results) {
                res = d.release_dates.results;
                for (i = 0; i < order.length; i++) {
                    for (j = 0; j < res.length; j++) {
                        if (res[j].iso_3166_1 === order[i]) {
                            r = (res[j].release_dates || []).filter(function (x) { return x.certification; })[0];
                            if (r) return r.certification;
                        }
                    }
                }
            }
            if (d.content_ratings && d.content_ratings.results) {
                res = d.content_ratings.results;
                for (i = 0; i < order.length; i++) {
                    r = res.filter(function (x) { return x.iso_3166_1 === order[i] && x.rating; })[0];
                    if (r) return r.rating;
                }
            }
            return '';
        }

        function applyMeta(d, ep) {
            var title = d.title || d.name || '';
            if (title) {
                S.title = title;
                var h = $('title');
                h.classList.remove('skel');
                h.textContent = title;
                document.title = title;
                $('ltitle').textContent = title;
            }

            /* Logo oficial (si existe) reemplaza al texto */
            var lp = pickLogo(d.images);
            if (lp) {
                preload('https://image.tmdb.org/t/p/w500' + lp).then(function (u) {
                    if (!u) return;
                    var lg = $('logo');
                    lg.alt = title; lg.src = u; lg.hidden = false; lg.style.display = 'block';
                    $('title').style.display = 'none';
                    requestAnimationFrame(function () { lg.classList.add('on'); });
                });
            }

            /* Episodio */
            if (ep && (ep.name || S.episode)) {
                var line = T.s + S.season + ' · ' + T.e + S.episode + (ep.name ? ' — ' + ep.name : '');
                var epEl = $('ep');
                epEl.textContent = line; epEl.hidden = false;
            }

            /* Chips */
            var meta = $('meta');
            meta.textContent = '';
            var va = ep && ep.vote_average > 0 ? ep.vote_average : d.vote_average;
            if (va && va > 0) meta.appendChild(el('span', 'chip star', '★ ' + Number(va).toFixed(1)));
            var date = d.release_date || d.first_air_date || '';
            if (date) meta.appendChild(el('span', 'chip', date.slice(0, 4)));
            var rt = ep && ep.runtime ? ep.runtime : (d.runtime || (d.episode_run_time && d.episode_run_time[0]));
            var rts = fmtRuntime(rt);
            if (rts) meta.appendChild(el('span', 'chip', rts));
            var cert = pickCert(d);
            if (cert) meta.appendChild(el('span', 'chip', cert));
            (d.genres || []).slice(0, 2).forEach(function (g) { meta.appendChild(el('span', 'chip', g.name)); });

            /* Sinopsis */
            var syn = (ep && ep.overview) || d.overview || '';
            if (syn) { var se = $('syn'); se.textContent = syn; se.hidden = false; }

            /* Fondo: version chica borrosa al instante, la grande entra encima */
            var small = Math.min(window.innerWidth || 800, (window.screen && window.screen.width) || 800) <= 780;
            var bd = d.backdrop_path || (ep && ep.still_path) || d.poster_path;
            if (bd) {
                preload('https://image.tmdb.org/t/p/w300' + bd).then(function (u) {
                    if (u) { $('bgLo').style.backgroundImage = 'url("' + u + '")'; $('bgLo').classList.add('on'); }
                });
                preload('https://image.tmdb.org/t/p/' + (small ? 'w780' : 'w1280') + bd).then(function (u) {
                    if (u) { $('bgHi').style.backgroundImage = 'url("' + u + '")'; $('bgHi').classList.add('on'); }
                });
            }
        }

        function loadMeta() {
            var L = CFG.tmdbLang, imgs = '&append_to_response=images,' + (S.tipo === 'movie' ? 'release_dates' : 'content_ratings') + '&include_image_language=' + CFG.imgLangs;
            var base = '/' + (S.tipo === 'movie' ? 'movie' : 'tv') + '/' + S.id + '?language=' + L + imgs;
            var pBase = tmdb(base);
            var pEp = (S.tipo === 'tv' && S.season && S.episode)
                ? tmdb('/tv/' + S.id + '/season/' + S.season + '/episode/' + S.episode + '?language=' + L) : Promise.resolve(null);
            return Promise.all([pBase, pEp]).then(function (r) {
                var d = r[0], ep = r[1];
                if (!d) { if (!S.title) { var h = $('title'); h.classList.remove('skel'); h.textContent = T.available; } return; }
                /* Si falta la sinopsis en este idioma, se completa con ingles */
                var needFb = L.slice(0, 2) !== 'en' && (!d.overview || (ep && !ep.overview && !d.overview));
                if (!needFb) return applyMeta(d, ep);
                var fbPath = '/' + (S.tipo === 'movie' ? 'movie' : 'tv') + '/' + S.id + '?language=en-US';
                return tmdb(fbPath).then(function (fb) {
                    if (fb) {
                        if (!d.overview) d.overview = fb.overview;
                        if (!d.title && !d.name) { d.title = fb.title; d.name = fb.name; }
                    }
                    applyMeta(d, ep);
                });
            });
        }

        /* ═══ 3) Reproducir ═══ */
        function startTimeout() {
            var s = parseFloat(qs.get('to'));
            if (!(s >= 1 && s <= 120)) s = DEFAULT_TIMEOUT_S;
            clearTimeout(timers.fail);
            timers.fail = setTimeout(function () {
                if (S.loaded) return;
                showError(T.slow, T.slowHint, true);
                emit('timeout');
            }, s * 1000);
        }

        function start() {
            if (S.started || !S.url) return;
            S.started = true; S.loaded = false; S.t0 = Date.now();
            var st = $('stage');
            st.classList.remove('err', 'out', 'done');
            st.classList.add('busy');
            $('lstep').textContent = T.steps[0];
            timers.step.forEach(clearTimeout);
            timers.step = [
                setTimeout(function () { $('lstep').textContent = T.steps[1]; }, 1400),
                setTimeout(function () { $('lstep').textContent = T.steps[2]; }, 4200)
            ];
            var f = $('player');
            f.style.display = 'block';
            f.src = S.url;
            startTimeout();
            emit('play');
        }

        function reveal() {
            var st = $('stage');
            clearTimeout(timers.fail);
            timers.step.forEach(clearTimeout); timers.step = [];
            st.classList.add('done');
            setTimeout(function () { st.classList.add('out'); }, 260);
            var tx = $('toastText');
            tx.textContent = T.now + ' · ' + (S.title || '') + (S.episode ? ' · ' + T.s + S.season + T.e + S.episode : '');
            var tt = $('toast');
            setTimeout(function () { tt.classList.add('on'); }, 600);
            setTimeout(function () { tt.classList.remove('on'); }, 4600);
            emit('loaded');
        }

        $('player').addEventListener('load', function () {
            var src = this.getAttribute('src');
            if (!S.started || S.loaded || !src || src === 'about:blank') return;
            S.loaded = true;
            setTimeout(reveal, Math.max(0, MIN_MS - (Date.now() - S.t0)));
        });

        function retry() {
            var f = $('player');
            S.started = false; S.loaded = false;
            f.src = 'about:blank';
            setTimeout(start, 80);
        }

        $('play').addEventListener('click', start);
        $('retry').addEventListener('click', retry);

        /* ═══ Inicio ═══ */
        var bad = parseHash();
        if (bad) {
            $('title').classList.remove('skel');
            $('title').textContent = '';
            showError(T.badLink, bad, false);
            emit('error', { reason: bad });
        } else {
            preconnect(S.url);
            emit('ready');
            loadMeta();
            var a = qs.get('a');
            if (a === '1' || a === 'true') { $('ltitle').textContent = $('ltitle').textContent || ''; start(); }
        }
    })();
    </script>
</body>
</html>
