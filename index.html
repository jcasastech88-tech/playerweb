<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Seguro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 1;
        }
        
        /* Pantalla de Carga con Backdrop */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
            background: rgba(5, 5, 5, 0.85); /* Capa oscura encima del fondo */
        }

        /* Fondo dinámico difuminado */
        .backdrop-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(0.4);
            transform: scale(1.1); /* Evita bordes blancos por el blur */
            z-index: -1;
        }

        /* Detalles del contenido */
        .meta-content {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            max-width: 80%;
            animation: fadeIn 0.8s ease;
        }
        .media-title {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        .badges {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .badge-lang {
            background: #00aa66;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Botón de Play */
        .play-btn {
            width: 90px;
            height: 90px;
            background: #ff0055;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.9);
        }
        .play-icon {
            width: 0; height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #fff;
            margin-left: 8px;
        }

        .status-text {
            color: #ffffff;
            margin-top: 25px;
            font-size: 1.1rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .spinner {
            display: none;
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #ff0055;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .error-msg { color: #ff4444; display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div id="overlay" class="overlay-screen">
            <!-- Imagen de fondo que cambiará dinámicamente -->
            <div id="backdrop" class="backdrop-bg"></div>

            <div id="spinner" class="spinner"></div>
            
            <!-- Bloque de título y badges -->
            <div id="metaContent" class="meta-content" style="display: none;">
                <h1 id="mediaTitle" class="media-title">Cargando...</h1>
                <div class="badges">
                    <span class="badge-lang">Español</span>
                </div>
            </div>

            <div id="playContainer" onclick="procesarVideo()" style="display: none;">
                <div class="play-btn">
                    <div class="play-icon"></div>
                </div>
            </div>

            <div id="status" class="status-text">Cargando información...</div>
            <div id="error" class="error-msg"><h2>Enlace no disponible</h2></div>
        </div>

        <iframe id="player" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        // REEMPLAZA ESTO CON TU API KEY DE TMDB
        const TMDB_API_KEY = '51800c8d9e13631a7ded6f17f363e7a5'; 
        let urlDecodificada = "";

        async function inicializar() {
            // Captura el hash completo: tipo/id/base64
            const hashRaw = window.location.hash.substring(1);
            const partes = hashRaw.split('/');

            if (partes.length >= 3) {
                const tipo = partes[0];      // 'movie' o 'tv'
                const tmdbId = partes[1];    // ID numérico
                const base64Url = partes[2]; // Enlace cifrado

                try {
                    // 1. Decodificar URL del video
                    const urlReal = atob(base64Url);
                    if (urlReal.startsWith('http://') || urlReal.startsWith('https://')) {
                        urlDecodificada = urlReal;
                    } else { throw new Error(); }

                    // 2. Consultar la API de TMDB en español
                    await obtenerDatosTMDB(tipo, tmdbId);

                    // Mostrar interfaz de Play
                    document.getElementById('playContainer').style.display = 'flex';
                    document.getElementById('metaContent').style.display = 'block';
                    document.getElementById('status').innerText = "Haz clic para reproducir";

                } catch (e) {
                    mostrarError();
                }
            } else {
                mostrarError("Faltan parámetros en el reproductor.");
            }
        }

        async function obtenerDatosTMDB(tipo, id) {
            const urlFetch = `https://api.themoviedb.org/3/${tipo}/${id}?api_key=${TMDB_API_KEY}&language=es-ES`;
            
            try {
                const respuesta = await fetch(urlFetch);
                if (!respuesta.ok) return; // Si falla la API continúa con diseño genérico
                
                const datos = await respuesta.json();
                
                // Extraer título (las películas usan 'title', las series usan 'name')
                const titulo = datos.title || datos.name;
                const backdropPath = datos.backdrop_path;

                if (titulo) {
                    document.getElementById('mediaTitle').innerText = titulo;
                }
                if (backdropPath) {
                    document.getElementById('backdrop').style.backgroundImage = `url('https://image.tmdb.org/t/p/w1280${backdropPath}')`;
                }
            } catch (error) {
                console.log("Error consultando TMDB, usando diseño por defecto.");
            }
        }

        function procesarVideo() {
            if (!urlDecodificada) return;

            document.getElementById('playContainer').style.display = 'none';
            document.getElementById('metaContent').style.display = 'none';
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('status').innerText = "Generando entorno seguro...";

            setTimeout(() => {
                const iframe = document.getElementById('player');
                const overlay = document.getElementById('overlay');
                
                iframe.src = urlDecodificada;
                iframe.style.display = 'block';

                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            }, 1300);
        }

        function mostrarError(msg) {
            document.getElementById('playContainer').style.display = 'none';
            document.getElementById('metaContent').style.display = 'none';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            if(msg) document.getElementById('error').innerHTML = `<h2>${msg}</h2>`;
            document.getElementById('error').style.display = 'block';
        }

        window.onload = inicializar;
    </script>
</body>
</html>
