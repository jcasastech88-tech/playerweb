<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050505">
    <script disable-devtool-auto="true" src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <title>Reproductor Pro Cinewick</title>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #00e5c8;          /* color principal (el tema puede mandar otro con ?c=RRGGBB) */
            --accent-rgb: 0, 229, 200;
            --bg: #050505;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, .74);
            --error: #ff5d5d;

            /* Todo escala con el alto del propio reproductor */
            --pb: clamp(50px, 17vh, 92px);
            --gap: clamp(5px, 1.7vh, 15px);
            --fs-title: clamp(1.15rem, 6.4vh, 2.7rem);
            --fs-chip: clamp(.62rem, 2.5vh, .82rem);
            --fs-syn: clamp(.78rem, 2.7vh, 1rem);
        }

        html, body {
            width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
            font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #player {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: 0; display: none; z-index: 1; background: #000;
        }

        /* ───────── Escenario (portada + carga + error) ───────── */
        .stage {
            position: absolute; inset: 0; z-index: 10; overflow: hidden;
            transition: opacity .7s ease, visibility .7s;
        }
        .stage.out { opacity: 0; visibility: hidden; }

        .bg { position: absolute; inset: 0; background: #07090b; }
        .bg-img {
            position: absolute; inset: -5%; background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.3s ease; will-change: transform, opacity;
        }
        .bg-img.lo { filter: blur(16px) brightness(.8); }
        .bg-img.on { opacity: 1; }
        .bg-img.hi.on { animation: kenburns 30s ease-in-out infinite alternate; }
        @keyframes kenburns {
            from { transform: scale(1.03) translate3d(0, 0, 0); }
            to   { transform: scale(1.16) translate3d(-1.6%, -1.1%, 0); }
        }
        .shade {
            position: absolute; inset: 0;
            background:
                radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,.12) 0%, rgba(0,0,0,.62) 68%, rgba(0,0,0,.92) 100%),
                linear-gradient(180deg, rgba(0,0,0,.62) 0%, transparent 30%, transparent 52%, rgba(0,0,0,.9) 100%);
        }

        /* Barra superior */
        .top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 4;
            display: flex; justify-content: space-between; align-items: center;
            padding: max(clamp(8px, 2.2vh, 16px), env(safe-area-inset-top)) clamp(10px, 3vw, 22px) 0;
        }
        .brand {
            display: flex; align-items: center; gap: .5em;
            font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
            letter-spacing: .2em; font-size: clamp(.82rem, 3.1vh, 1.2rem); opacity: .9;
        }
        .brand i { width: .5em; height: .5em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .badge {
            font-size: clamp(.58rem, 2.3vh, .76rem); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            padding: .3em .85em; border-radius: 999px;
            background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }

        /* Centro: titulo, datos, play */
        .center {
            position: absolute; inset: 0; z-index: 3;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: var(--gap); text-align: center;
            padding: clamp(26px, 8vh, 56px) clamp(14px, 5vw, 56px) clamp(10px, 3vh, 28px);
            transition: opacity .45s ease, transform .45s ease;
        }
        .stage.busy .center, .stage.err .center { opacity: 0; transform: scale(.97); pointer-events: none; }

        .logo {
            display: none; max-height: clamp(34px, 21vh, 130px); max-width: min(78%, 440px);
            object-fit: contain; filter: drop-shadow(0 4px 18px rgba(0,0,0,.75));
            opacity: 0; transition: opacity .6s ease;
        }
        .logo.on { opacity: 1; }
        .title {
            font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400;
            font-size: var(--fs-title); line-height: 1.04; letter-spacing: .02em;
            text-shadow: 0 3px 18px rgba(0,0,0,.85); max-width: min(92%, 760px);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .skel {
            color: transparent !important; text-shadow: none; border-radius: 8px; min-width: 46%;
            background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.18), rgba(255,255,255,.06));
            background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
        }
        @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

        .ep {
            font-size: clamp(.72rem, 2.9vh, 1.05rem); color: var(--accent); font-weight: 700; letter-spacing: .04em;
            text-shadow: 0 2px 10px rgba(0,0,0,.8); max-width: 92%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ep[hidden], .logo[hidden], .syn[hidden] { display: none !important; }

        .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, 1.2vh, 8px); max-width: 94%; }
        .chip {
            font-size: var(--fs-chip); font-weight: 500; line-height: 1; white-space: nowrap;
            padding: .42em .8em; border-radius: 999px; color: var(--muted);
            background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .chip.star { color: #ffd166; font-weight: 700; }
        .chip.lang { color: #04100e; background: var(--accent); border-color: transparent; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

        .syn {
            display: none; max-width: min(90%, 580px); color: var(--muted); font-size: var(--fs-syn); line-height: 1.5;
            text-shadow: 0 2px 10px rgba(0,0,0,.9);
            -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        @media (min-height: 340px) { .syn { display: -webkit-box; } }

        /* Boton play */
        .play {
            position: relative; width: var(--pb); height: var(--pb); border: 0; border-radius: 50%; cursor: pointer;
            display: grid; place-items: center; color: #04100e; background: var(--accent);
            box-shadow: 0 10px 44px rgba(var(--accent-rgb), .5), inset 0 0 0 1px rgba(255,255,255,.25);
            transition: transform .25s ease, box-shadow .25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .play::before, .play::after {
            content: ""; position: absolute; inset: -9px; border-radius: 50%;
            border: 2px solid rgba(var(--accent-rgb), .55); animation: ring 2.6s ease-out infinite; pointer-events: none;
        }
        .play::after { animation-delay: 1.3s; }
        @keyframes ring { 0% { transform: scale(.88); opacity: .85; } 100% { transform: scale(1.55); opacity: 0; } }
        .play svg { width: 44%; height: 44%; fill: currentColor; margin-left: 7%; }
        .play:hover { transform: scale(1.08); box-shadow: 0 14px 56px rgba(var(--accent-rgb), .7), inset 0 0 0 1px rgba(255,255,255,.3); }
        .play:active { transform: scale(.95); }
        .play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
        .hint { font-size: clamp(.68rem, 2.6vh, .9rem); letter-spacing: .06em; color: var(--muted); text-shadow: 0 2px 8px rgba(0,0,0,.9); }
        @media (max-height: 239px) { .hint { display: none; } }

        /* Pantalla de carga */
        .loader {
            position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: clamp(8px, 2.4vh, 18px);
            opacity: 0; pointer-events: none; transition: opacity .45s ease;
        }
        .stage.busy .loader { opacity: 1; }
        .stage.err .loader { opacity: 0; }
        .ring {
            width: clamp(34px, 12vh, 62px); height: clamp(34px, 12vh, 62px); border-radius: 50%;
            border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent);
            animation: spin .9s linear infinite; box-shadow: 0 0 28px rgba(var(--accent-rgb), .25);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ltitle { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: .06em; font-size: clamp(.95rem, 4.6vh, 1.7rem); text-shadow: 0 2px 14px rgba(0,0,0,.9); max-width: 90%; text-align: center; }
        .lstep { font-size: clamp(.68rem, 2.6vh, .92rem); color: var(--muted); min-height: 1.2em; }
        .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.1); }
        .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
        .stage.busy .bar i { animation: fill 7s cubic-bezier(.1,.6,.2,1) forwards; }
        .stage.done .bar i { animation: none; width: 100%; transition: width .3s ease; }
        @keyframes fill { from { width: 0; } to { width: 86%; } }

        /* Error / lentitud */
        .errbox {
            position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: clamp(6px, 2vh, 14px);
            padding: clamp(14px, 4vh, 36px); text-align: center; background: rgba(5,5,5,.62);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .stage.err .errbox { display: flex; }
        .errbox svg { width: clamp(26px, 9vh, 46px); height: clamp(26px, 9vh, 46px); fill: var(--error); }
        .errbox h2 { font-size: clamp(.95rem, 4vh, 1.4rem); font-weight: 700; }
        .errbox p { font-size: clamp(.7rem, 2.7vh, .95rem); color: var(--muted); max-width: 440px; line-height: 1.45; }
        .errbox p:empty { display: none; }
        .retry {
            margin-top: 2px; padding: .65em 1.5em; border: 0; border-radius: 999px; cursor: pointer;
            font: 700 clamp(.72rem, 2.8vh, .95rem) 'DM Sans', sans-serif; color: #04100e; background: var(--accent);
            box-shadow: 0 8px 28px rgba(var(--accent-rgb), .4);
        }
        .retry[hidden] { display: none; }
        .retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        /* Aviso "Reproduciendo" sobre el video */
        .toast {
            position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 20; max-width: 80%;
            display: flex; align-items: center; gap: .6em; padding: .5em 1em .5em .8em; border-radius: 999px;
            font-size: clamp(.66rem, 2.6vh, .86rem); font-weight: 500; pointer-events: none;
            background: rgba(8,8,8,.78); border: 1px solid rgba(255,255,255,.14);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            opacity: 0; transform: translateY(-8px); transition: opacity .4s ease, transform .4s ease;
        }
        .toast.on { opacity: 1; transform: none; }
        .toast i { width: .55em; height: .55em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex-shrink: 0; }
        .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


        /* ═════════ Reproductor propio (.m3u8 / .mp4) ═════════ */
        .vwrap { position: absolute; inset: 0; z-index: 2; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .vwrap[hidden] { display: none; }
        .vwrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
        .vwrap.hide-ui { cursor: none; }
        .vtap { position: absolute; inset: 0; z-index: 3; }
        .vtop {
            position: absolute; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
            padding: max(clamp(8px, 2.2vh, 16px), env(safe-area-inset-top)) clamp(12px, 3vw, 24px) clamp(18px, 6vh, 40px);
            background: linear-gradient(180deg, rgba(0,0,0,.78), rgba(0,0,0,0));
            font-size: clamp(.78rem, 3vh, 1.05rem); font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.8);
            transition: opacity .3s ease;
        }
        .vtop span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vbig {
            position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: clamp(52px, 18vh, 84px); height: clamp(52px, 18vh, 84px); border: 0; border-radius: 50%; cursor: pointer; padding: 0;
            display: grid; place-items: center; color: #fff;
            background: rgba(10,10,10,.55); border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .25s ease, transform .25s ease;
        }
        .vbig svg { width: 46%; height: 46%; fill: currentColor; margin-left: 6%; }
        .vbig:hover { transform: translate(-50%, -50%) scale(1.07); }
        .vwrap.playing .vbig, .vwrap.buffering .vbig { opacity: 0; pointer-events: none; }
        .vspin {
            position: absolute; z-index: 4; left: 50%; top: 50%; width: clamp(34px, 11vh, 58px); height: clamp(34px, 11vh, 58px);
            margin: calc(clamp(34px, 11vh, 58px) / -2) 0 0 calc(clamp(34px, 11vh, 58px) / -2);
            border-radius: 50%; border: 3px solid rgba(255,255,255,.16); border-top-color: var(--accent);
            animation: spin .9s linear infinite; display: none; pointer-events: none;
        }
        .vwrap.buffering .vspin { display: block; }
        .vseekfx {
            position: absolute; z-index: 5; top: 50%; transform: translateY(-50%) scale(.8); opacity: 0; pointer-events: none;
            padding: .7em 1.1em; border-radius: 999px; font-weight: 700; font-size: clamp(.8rem, 3.4vh, 1.1rem);
            background: rgba(10,10,10,.6); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .vseekfx.l { left: 12%; } .vseekfx.r { right: 12%; }
        .vseekfx.on { animation: seekfx .6s ease; }
        @keyframes seekfx { 0% { opacity: 0; transform: translateY(-50%) scale(.7); } 25% { opacity: 1; transform: translateY(-50%) scale(1); } 100% { opacity: 0; transform: translateY(-50%) scale(1.05); } }

        .vbar {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
            padding: clamp(14px, 6vh, 34px) clamp(8px, 2.2vw, 18px) max(clamp(4px, 1.2vh, 10px), env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.55) 55%, rgba(0,0,0,0)); transition: opacity .3s ease;
        }
        .vwrap.hide-ui .vbar, .vwrap.hide-ui .vtop { opacity: 0; pointer-events: none; }
        .seek { position: relative; height: 18px; cursor: pointer; touch-action: none; outline: none; }
        .seek::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); transition: height .15s, top .15s; }
        .seek:hover::before, .seek.drag::before { top: 6px; height: 6px; }
        .seek-buf, .seek-cur { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 4px; width: 0; transition: height .15s, top .15s; }
        .seek:hover .seek-buf, .seek:hover .seek-cur, .seek.drag .seek-buf, .seek.drag .seek-cur { top: 6px; height: 6px; }
        .seek-buf { background: rgba(255,255,255,.34); }
        .seek-cur { background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), .6); }
        .seek-thumb { position: absolute; top: 9px; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .45); transform: scale(0); transition: transform .15s; pointer-events: none; }
        .seek:hover .seek-thumb, .seek.drag .seek-thumb, .seek:focus-visible .seek-thumb { transform: scale(1); }
        .seek-tip { position: absolute; bottom: 20px; left: 0; transform: translateX(-50%); padding: .25em .6em; border-radius: 6px; font-size: .72rem; font-weight: 700; background: rgba(0,0,0,.85); border: 1px solid rgba(255,255,255,.18); pointer-events: none; opacity: 0; white-space: nowrap; }
        .seek:hover .seek-tip, .seek.drag .seek-tip { opacity: 1; }
        .vrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .vl, .vr { display: flex; align-items: center; gap: clamp(0px, .6vw, 4px); min-width: 0; }
        .vb {
            width: clamp(30px, 10.5vh, 44px); height: clamp(30px, 10.5vh, 44px); padding: 0; border: 0; border-radius: 50%;
            background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
            transition: background .2s, transform .15s; -webkit-tap-highlight-color: transparent;
        }
        .vb svg { width: 56%; height: 56%; fill: currentColor; }
        .vb:hover { background: rgba(255,255,255,.14); }
        .vb:active { transform: scale(.92); }
        .vb:focus-visible, .mi:focus-visible, .mh:focus-visible, .vol:focus-visible, .vbig:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .vtime { font-size: clamp(.64rem, 2.7vh, .86rem); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; color: rgba(255,255,255,.9); }
        .vol { width: clamp(56px, 8vw, 84px); accent-color: var(--accent); cursor: pointer; margin: 0 4px; }
        @media (max-width: 559px), (hover: none) { .vol { display: none; } }
        @media (max-height: 259px) { .vb-sec { display: none; } }
        .vmenu {
            position: absolute; z-index: 8; right: clamp(8px, 2vw, 16px); bottom: calc(clamp(52px, 16vh, 78px) + 6px);
            min-width: 210px; max-width: 86%; max-height: calc(100% - clamp(70px, 24vh, 110px)); overflow-y: auto;
            padding: 6px; border-radius: 14px; background: rgba(14,14,17,.95); border: 1px solid rgba(255,255,255,.13);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 18px 50px rgba(0,0,0,.7);
            animation: menuIn .16s ease;
        }
        .vmenu[hidden] { display: none; }
        @keyframes menuIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .mi, .mh {
            display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 16px; padding: .6em .8em; border: 0; border-radius: 9px;
            background: transparent; color: #fff; cursor: pointer; font: 500 clamp(.74rem, 2.9vh, .92rem) 'DM Sans', sans-serif; text-align: left;
        }
        .mh { font-weight: 700; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.1); border-radius: 9px 9px 0 0; margin-bottom: 4px; }
        .mi:hover, .mh:hover { background: rgba(255,255,255,.08); }
        .mi .mv { color: var(--muted); font-size: .92em; }
        .mi.on { color: var(--accent); font-weight: 700; }
        .mi.on::after { content: "✓"; margin-left: auto; }
        .vtoast2 {
            position: absolute; z-index: 7; left: clamp(8px, 2vw, 16px); bottom: calc(clamp(52px, 16vh, 78px) + 6px);
            display: none; align-items: center; gap: .9em; padding: .55em .6em .55em 1em; border-radius: 999px;
            font-size: clamp(.68rem, 2.7vh, .88rem); background: rgba(10,10,10,.82); border: 1px solid rgba(255,255,255,.16);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .vtoast2.on { display: flex; animation: menuIn .25s ease; }
        .vtoast2 button { border: 0; border-radius: 999px; padding: .4em .95em; cursor: pointer; font: 700 1em 'DM Sans', sans-serif; color: #04100e; background: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            .bg-img.hi.on, .play::before, .play::after, .ring, .skel { animation: none !important; }
            .stage, .center, .bg-img { transition: none; }
        }
    </style>
</head>
<body>

    <div id="stage" class="stage">
        <div class="bg">
            <div id="bgLo" class="bg-img lo"></div>
            <div id="bgHi" class="bg-img hi"></div>
            <div class="shade"></div>
        </div>

        <div class="top">
            <div class="brand"><i></i>CINEWICK</div>
            <div id="badge" class="badge"></div>
        </div>

        <main id="center" class="center">
            <img id="logo" class="logo" alt="" hidden>
            <h1 id="title" class="title skel">&nbsp;</h1>
            <div id="ep" class="ep" hidden></div>
            <div id="meta" class="meta"></div>
            <p id="syn" class="syn" hidden></p>
            <button id="play" class="play" type="button" aria-label="">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div id="hint" class="hint"></div>
        </main>

        <div class="loader" aria-live="polite">
            <div class="ring"></div>
            <div id="ltitle" class="ltitle"></div>
            <div id="lstep" class="lstep"></div>
        </div>
        <div class="bar"><i></i></div>

        <div id="errbox" class="errbox" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            <h2 id="errTitle"></h2>
            <p id="errText"></p>
            <button id="retry" class="retry" type="button" hidden></button>
        </div>
    </div>


    <div id="vwrap" class="vwrap" hidden>
        <video id="vid" playsinline webkit-playsinline preload="auto"></video>
        <div id="vtap" class="vtap"></div>
        <div id="vtop" class="vtop"><span id="vtitle"></span></div>

            var tip = $('seekTip');
            tip.textContent = fmtTime(p * d);
            tip.style.left = (p * 100) + '%';
        }
        var seekEl = $('seek');
        seekEl.addEventListener('pointerdown', function (e) {
            if (!isFinite(vid.duration)) return;
            V.dragging = true; seekEl.classList.add('drag');
            try { seekEl.setPointerCapture(e.pointerId); } catch (x) {}
            var p = seekPct(e); showTip(p); previewSeek(p);
        });
        seekEl.addEventListener('pointermove', function (e) {
            var p = seekPct(e); showTip(p);
            if (V.dragging) previewSeek(p);
        });
        function endDrag(e) {
            if (!V.dragging) return;
            V.dragging = false; seekEl.classList.remove('drag');
            if (e && e.type === 'pointerup' && isFinite(vid.duration)) vid.currentTime = seekPct(e) * vid.duration;
            updateTime(); showUI();
        }
        seekEl.addEventListener('pointerup', endDrag);
        seekEl.addEventListener('pointercancel', endDrag);

        /* Volumen (se recuerda) */
        function setVolIcon() { ico($('bMute'), (vid.muted || vid.volume === 0) ? 'mute' : 'vol'); $('bMute').setAttribute('aria-label', (vid.muted || vid.volume === 0) ? T.unmute : T.mute); }
        try {
            var sv = JSON.parse(localStorage.getItem('cwvol') || 'null');
            if (sv) { vid.volume = Math.max(0, Math.min(1, +sv.v)); vid.muted = !!sv.m; }
        } catch (e) {}
        $('vol').value = vid.muted ? 0 : vid.volume;
        setVolIcon();
        vid.addEventListener('volumechange', function () {
            $('vol').value = vid.muted ? 0 : vid.volume;
            setVolIcon();
            try { localStorage.setItem('cwvol', JSON.stringify({ v: vid.volume, m: vid.muted })); } catch (e) {}
        });
        $('vol').addEventListener('input', function () { vid.muted = false; vid.volume = parseFloat(this.value); });
        $('bMute').addEventListener('click', function () { vid.muted = !vid.muted; if (!vid.muted && vid.volume === 0) vid.volume = .5; });

        /* Pantalla completa / PiP */
        function isFs() { return document.fullscreenElement === vwrap || document.webkitFullscreenElement === vwrap; }
        function toggleFs() {
            if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
            if (vwrap.requestFullscreen) vwrap.requestFullscreen();
            else if (vwrap.webkitRequestFullscreen) vwrap.webkitRequestFullscreen();
            else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();   /* iPhone: pantalla completa nativa */
        }
        function syncFs() { ico($('bFs'), isFs() ? 'fsx' : 'fs'); $('bFs').setAttribute('aria-label', isFs() ? T.exitFs : T.fs); }
        document.addEventListener('fullscreenchange', syncFs);
        document.addEventListener('webkitfullscreenchange', syncFs);
        var pipOk = !!(document.pictureInPictureEnabled && vid.requestPictureInPicture) ||
                    !!(vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture'));
        if (!pipOk) $('bPip').style.display = 'none';
        $('bPip').addEventListener('click', function () {
            try {
                if (document.pictureInPictureElement) document.exitPictureInPicture();
                else if (vid.requestPictureInPicture) vid.requestPictureInPicture();
                else vid.webkitSetPresentationMode(vid.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
            } catch (e) {}
        });

        /* Menu de ajustes: calidad, velocidad, audio, subtitulos */
        var RATES = [0.5, 0.75, 1, 1.25, 1.5, 2];
        function levels() { return (V.hls && V.hls.levels) ? V.hls.levels : []; }
        function audioTracks() { return (V.hls && V.hls.audioTracks) ? V.hls.audioTracks : []; }
        function subTracks() {
            if (V.hls && V.hls.subtitleTracks && V.hls.subtitleTracks.length) return V.hls.subtitleTracks;
            var out = [], tt = vid.textTracks || [], i;
            for (i = 0; i < tt.length; i++) if (tt[i].kind === 'subtitles' || tt[i].kind === 'captions') out.push({ name: tt[i].label || tt[i].language || ('#' + (i + 1)), _tt: tt[i] });
            return out;
        }
        function qualityLabel() {
            var lv = levels();
            if (V.quality > -1 && lv[V.quality]) return (lv[V.quality].height || '?') + 'p';
            var cur = V.hls && lv[V.hls.currentLevel];
            return T.auto + (cur && cur.height ? ' (' + cur.height + 'p)' : '');
        }
        function rateLabel() { return V.rate === 1 ? T.normal : V.rate + '×'; }
        function subLabel() {
            var st = subTracks();
            return (V.subSel > -1 && st[V.subSel]) ? (st[V.subSel].name || st[V.subSel].lang || ('#' + (V.subSel + 1))) : T.off;
        }
        function audioLabel() {
            var at = audioTracks(), cur = V.hls ? V.hls.audioTrack : 0;
            return at[cur] ? (at[cur].name || at[cur].lang || ('#' + (cur + 1))) : '';
        }
        function closeMenu() { V.menuOpen = false; $('vmenu').hidden = true; showUI(); }
        function buildMenu(view) {
            var m = $('vmenu'); m.textContent = '';
            function item(label, value, fn, on) {
                var b = el('button', 'mi' + (on ? ' on' : '')); b.type = 'button';
                b.appendChild(el('span', 'ml', label));
                if (value != null) b.appendChild(el('span', 'mv', value + (fn && view === 'main' ? '  ›' : '')));
                b.addEventListener('click', fn);
                m.appendChild(b);
            }
            function head(text) {
                var h = el('button', 'mh', '‹  ' + text); h.type = 'button';
                h.addEventListener('click', function () { buildMenu('main'); });
                m.appendChild(h);
            }
            var i;
            if (view === 'main') {
                if (levels().length > 1) item(T.quality, qualityLabel(), function () { buildMenu('quality'); });
                item(T.speed, rateLabel(), function () { buildMenu('speed'); });
                if (audioTracks().length > 1) item(T.audio, audioLabel(), function () { buildMenu('audio'); });
                if (subTracks().length) item(T.subs, subLabel(), function () { buildMenu('subs'); });
            } else if (view === 'quality') {
                head(T.quality);
                var lv = levels(), order = [];
                for (i = 0; i < lv.length; i++) order.push(i);
                order.sort(function (a, b) { return (lv[b].height || 0) - (lv[a].height || 0) || (lv[b].bitrate || 0) - (lv[a].bitrate || 0); });
                item(T.auto, null, function () { V.quality = -1; if (V.hls) V.hls.currentLevel = -1; closeMenu(); }, V.quality === -1);
                order.forEach(function (idx) {
                    item((lv[idx].height ? lv[idx].height + 'p' : (Math.round((lv[idx].bitrate || 0) / 1000) + ' kbps')), null,
                        function () { V.quality = idx; if (V.hls) V.hls.currentLevel = idx; closeMenu(); }, V.quality === idx);
                });
            } else if (view === 'speed') {
                head(T.speed);
                RATES.forEach(function (r) {
                    item(r === 1 ? T.normal : r + '×', null, function () { V.rate = r; vid.playbackRate = r; closeMenu(); }, V.rate === r);
                });
            } else if (view === 'audio') {
                head(T.audio);
                audioTracks().forEach(function (a, idx) {
                    item(a.name || a.lang || ('#' + (idx + 1)), null, function () { if (V.hls) V.hls.audioTrack = idx; closeMenu(); }, V.hls && V.hls.audioTrack === idx);
                });
            } else if (view === 'subs') {
                head(T.subs);
                item(T.off, null, function () { setSub(-1); closeMenu(); }, V.subSel === -1);
                subTracks().forEach(function (s, idx) {
                    item(s.name || s.lang || ('#' + (idx + 1)), null, function () { setSub(idx); closeMenu(); }, V.subSel === idx);
                });
            }
        }
        function setSub(idx) {
            V.subSel = idx;
            if (V.hls && V.hls.subtitleTracks && V.hls.subtitleTracks.length) { V.hls.subtitleTrack = idx; V.hls.subtitleDisplay = idx > -1; return; }
            var st = subTracks(), i;
            for (i = 0; i < st.length; i++) if (st[i]._tt) st[i]._tt.mode = (i === idx) ? 'showing' : 'disabled';
        }
        $('bSet').addEventListener('click', function (e) {
            e.stopPropagation();
            if (V.menuOpen) { closeMenu(); return; }
            buildMenu('main'); $('vmenu').hidden = false; V.menuOpen = true; showUI();
        });
        document.addEventListener('click', function (e) {
            if (V.menuOpen && !$('vmenu').contains(e.target) && e.target !== $('bSet') && !$('bSet').contains(e.target)) closeMenu();
        });

        /* Controles */
        $('bPlay').addEventListener('click', togglePlay);
        $('vbig').addEventListener('click', togglePlay);
        $('bBack').addEventListener('click', function () { skip(-10); });
        $('bFwd').addEventListener('click', function () { skip(10); });
        $('bFs').addEventListener('click', toggleFs);
        vwrap.addEventListener('pointermove', showUI);
        vwrap.addEventListener('pointerdown', showUI);
        $('vtap').addEventListener('pointerup', function (e) {
            if (V.menuOpen) { closeMenu(); return; }
            var now = Date.now(), r = $('vtap').getBoundingClientRect(), x = (e.clientX - r.left) / (r.width || 1);
            clearTimeout(V.tapT);
            if (now - V.lastTap < 300) {            /* doble toque: ±10 s o pantalla completa */
                V.lastTap = 0;
                if (x < .35) skip(-10); else if (x > .65) skip(10); else toggleFs();
                return;
            }
            V.lastTap = now;
            var touch = e.pointerType === 'touch';
            V.tapT = setTimeout(function () {
                if (touch && vwrap.classList.contains('hide-ui')) showUI(); else togglePlay();
            }, 260);
        });
        document.addEventListener('keydown', function (e) {
            if (S.mode !== 'video' || !S.started || e.ctrlKey || e.metaKey || e.altKey) return;
            var k = e.key, ok = true;
            if (k === 'Escape') { if (V.menuOpen) closeMenu(); else ok = false; }
            else if (k === ' ' || k === 'k' || k === 'K') togglePlay();
            else if (k === 'ArrowLeft') skip(-5);
            else if (k === 'ArrowRight') skip(5);
            else if (k === 'j' || k === 'J') skip(-10);
            else if (k === 'l' || k === 'L') skip(10);
            else if (k === 'ArrowUp') { vid.muted = false; vid.volume = Math.min(1, vid.volume + .05); }
            else if (k === 'ArrowDown') { vid.volume = Math.max(0, vid.volume - .05); }
            else if (k === 'm' || k === 'M') vid.muted = !vid.muted;
            else if (k === 'f' || k === 'F') toggleFs();
            else if (/^[0-9]$/.test(k) && isFinite(vid.duration)) vid.currentTime = vid.duration * (+k / 10);
            else ok = false;
            if (ok) { e.preventDefault(); showUI(); }
        });

        /* Continuar donde lo dejaste */
        function posKey() { return 'cwpos:' + S.tipo + ':' + S.id + ':' + S.season + ':' + S.episode; }
        function savePos(force) {
            var now = Date.now();
            if (!force && now - V.saveT < 5000) return;
            V.saveT = now;
            var d = vid.duration, c = vid.currentTime;
            if (!isFinite(d) || d <= 0) return;
            try {
                if (c > 15 && c < d - 45) localStorage.setItem(posKey(), JSON.stringify({ t: Math.floor(c), d: Math.floor(d), ts: now }));
                else if (c >= d - 45) localStorage.removeItem(posKey());
            } catch (e) {}
        }
        function applyResume() {
            if (V.resumeApplied || !isFinite(vid.duration)) return;
            V.resumeApplied = true;
            try {
                var j = JSON.parse(localStorage.getItem(posKey()) || 'null');
                if (j && j.t > 15 && j.t < vid.duration - 45) {
                    vid.currentTime = j.t;
                    $('vtoast2Txt').textContent = T.resume + ' ' + fmtTime(j.t);
                    var tt = $('vtoast2'); tt.classList.add('on');
                    clearTimeout(V.toastT);
                    V.toastT = setTimeout(function () { tt.classList.remove('on'); }, 7000);
                }
            } catch (e) {}
        }
        $('vtoast2Btn').addEventListener('click', function () {
            vid.currentTime = 0; $('vtoast2').classList.remove('on');
            try { localStorage.removeItem(posKey()); } catch (e) {}
        });
        window.addEventListener('pagehide', function () { if (S.mode === 'video' && S.started) savePos(true); });

        /* Eventos del <video> */
        vid.addEventListener('playing', function () {
            buffering(false); setPlayState();
            if (S.started && !S.loaded) {
                S.loaded = true;
                setTimeout(reveal, Math.max(0, MIN_MS - (Date.now() - S.t0)));
            }
        });
        vid.addEventListener('pause', function () { setPlayState(); savePos(true); });
        vid.addEventListener('play', setPlayState);
        vid.addEventListener('waiting', function () { buffering(true); });
        vid.addEventListener('canplay', function () { buffering(false); });
        vid.addEventListener('loadedmetadata', function () { applyResume(); updateTime(); });
        vid.addEventListener('durationchange', updateTime);
        vid.addEventListener('timeupdate', function () { updateTime(); updateBuffer(); savePos(false); });
        vid.addEventListener('progress', updateBuffer);
        vid.addEventListener('ratechange', function () { V.rate = vid.playbackRate; });
        vid.addEventListener('ended', function () { setPlayState(); try { localStorage.removeItem(posKey()); } catch (e) {} emit('ended'); });
        vid.addEventListener('error', function () {
            if (S.mode === 'video' && S.started && !S.loaded) failVideo(T.vErrHint);
        });

        /* Motor */
        function destroyHls() {
            if (V.hls) { try { V.hls.destroy(); } catch (e) {} V.hls = null; }
        }
        function failVideo(msg) {
            destroyHls();
            try { vid.pause(); } catch (e) {}
            showError(T.vErr, msg, true);
            emit('error', { reason: 'video' });
        }
        function loadHlsLib() {
            return new Promise(function (res, rej) {
                if (window.Hls) return res(window.Hls);
                var s = document.createElement('script');
                s.src = HLS_SRC; s.integrity = HLS_SRI; s.crossOrigin = 'anonymous';
                s.onload = function () { window.Hls ? res(window.Hls) : rej(new Error('nohls')); };
                s.onerror = function () { rej(new Error('load')); };
                document.head.appendChild(s);
            });
        }
        function createHls(Hls) {
            var h = V.hls = new Hls({ enableWorker: true, capLevelToPlayerSize: true, maxBufferLength: 40 });
            var E = Hls.Events, ET = Hls.ErrorTypes || {};
            h.on(E.MANIFEST_PARSED, function () { tryPlay(); });
            h.on(E.ERROR, function (ev, d) {
                if (!d || !d.fatal) return;
                if (d.type === ET.NETWORK_ERROR) {
                    if (V.netRetries < 2) { V.netRetries++; h.startLoad(); } else failVideo(T.vNet);
                } else if (d.type === ET.MEDIA_ERROR) {
                    if (!V.mediaRetried) { V.mediaRetried = true; h.recoverMediaError(); } else failVideo(T.vErrHint);
                } else {
                    failVideo(T.vErrHint);
                }
            });
            h.attachMedia(vid);
            h.loadSource(S.url);
            tryPlay();   /* dentro del gesto del usuario */
        }
        function startVideo() {
            vwrap.hidden = false;
            V.netRetries = 0; V.mediaRetried = false; V.resumeApplied = false; V.quality = -1; V.subSel = -1;
            var url = S.url;
            var nativeOK = !!vid.canPlayType && vid.canPlayType('application/vnd.apple.mpegurl') !== '';
            function useNative() { V.native = true; vid.src = url; tryPlay(); }
            if (!isHls(url)) { vid.src = url; tryPlay(); return; }
            if (IS_APPLE && nativeOK) { useNative(); return; }
            loadHlsLib().then(function (Hls) {
                if (!Hls.isSupported()) { if (nativeOK) return useNative(); return failVideo(T.noEngine); }
                createHls(Hls);
            }).catch(function () { if (nativeOK) useNative(); else failVideo(T.loadEngine); });
        }

        /* ═══ 3) Reproducir ═══ */
        function startTimeout() {
            var s = parseFloat(qs.get('to'));
            if (!(s >= 1 && s <= 120)) s = DEFAULT_TIMEOUT_S;
            clearTimeout(timers.fail);
            timers.fail = setTimeout(function () {
                if (S.loaded) return;
                showError(T.slow, T.slowHint, true);
                emit('timeout');
            }, s * 1000);
        }

        function start() {
            if (S.started || !S.url) return;
            S.started = true; S.loaded = false; S.t0 = Date.now();
            var st = $('stage');
            st.classList.remove('err', 'out', 'done');
            st.classList.add('busy');
            $('lstep').textContent = T.steps[0];
            timers.step.forEach(clearTimeout);
            timers.step = [
                setTimeout(function () { $('lstep').textContent = T.steps[1]; }, 1400),
                setTimeout(function () { $('lstep').textContent = T.steps[2]; }, 4200)
            ];
            if (S.mode === 'video') {
                startVideo();
            } else {
                var f = $('player');
                f.style.display = 'block';
                f.src = S.url;
            }
            startTimeout();
            emit('play');
        }

        function reveal() {
            var st = $('stage');
            clearTimeout(timers.fail);
            timers.step.forEach(clearTimeout); timers.step = [];
            st.classList.add('done');
            setTimeout(function () { st.classList.add('out'); }, 260);
            if (S.mode === 'iframe') {
                var tx = $('toastText');
                tx.textContent = T.now + ' · ' + (S.title || '') + (S.episode ? ' · ' + T.s + S.season + T.e + S.episode : '');
                var tt = $('toast');
                setTimeout(function () { tt.classList.add('on'); }, 600);
                setTimeout(function () { tt.classList.remove('on'); }, 4600);
            } else {
                setPlayState();
            }
            emit('loaded');
        }

        $('player').addEventListener('load', function () {
            var src = this.getAttribute('src');
            if (S.mode !== 'iframe' || !S.started || S.loaded || !src || src === 'about:blank') return;
            S.loaded = true;
            setTimeout(reveal, Math.max(0, MIN_MS - (Date.now() - S.t0)));
        });

        function retry() {
            S.started = false; S.loaded = false;
            if (S.mode === 'video') {
                destroyHls();
                try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch (e) {}
            } else {
                $('player').src = 'about:blank';
            }
            setTimeout(start, 80);
        }

        $('play').addEventListener('click', start);
        $('retry').addEventListener('click', retry);

        /* ═══ Inicio ═══ */
        var bad = parseHash();
        if (bad) {
            $('title').classList.remove('skel');
            $('title').textContent = '';
            showError(T.badLink, bad, false);
            emit('error', { reason: bad });
        } else {
            preconnect(S.url);
            emit('ready');
            loadMeta();
            var a = qs.get('a');
            if (a === '1' || a === 'true') start();
        }
    })();
    </script>
</body>
</html>
